name: ShinnCheat

options:
  bundleIdPrefix: com.shinn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ShinnCheat:
    type: application
    platform: iOS

    sources:
      - path: ShinnCheatApp.swift
      - path: ContentView.swift
      - path: Glass.swift
      - path: HomeView.swift
      - path: Models.swift
      - path: Localization.swift
      - path: RepoStore.swift
      - path: PackageViews.swift
      - path: SecondaryViews.swift
      - path: ShinnPatchModels.swift
      - path: Patch3105Codec.swift
      - path: IPAPatchEngine.swift

    dependencies:
      - package: ZIPFoundation

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinn.cheat
        PRODUCT_NAME: ShinnCheat
        PRODUCT_MODULE_NAME: ShinnCheat

        TARGETED_DEVICE_FAMILY: "1,2"

        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"

        GENERATE_INFOPLIST_FILE: YES

        INFOPLIST_KEY_CFBundleDisplayName: "Shinn Cheat"
        INFOPLIST_KEY_CFBundleName: "ShinnCheat"

        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

        INFOPLIST_KEY_UILaunchScreen_Generation: YES

        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

        INFOPLIST_KEY_UISupportedInterfaceOrientATIONS_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

        CODE_SIGN_STYLE: Automatic

    scheme:
      gatherCoverageData: false

schemes:
  ShinnCheat:
    build:
      targets:
        ShinnCheat: all

    run:
      config: Debug

    test:
      config: Debug

    profile:
      config: Release

    analyze:
      config: Debug

    archive:
      config: Release