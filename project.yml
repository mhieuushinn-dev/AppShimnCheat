name: ShinnCheat
options:
  bundleIdPrefix: com.shinn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShinnCheat:
    type: application
    platform: iOS
    sources:
      - path: ShinnCheatApp.swift
      - path: ContentView.swift
      - path: Glass.swift
      - path: HomeView.swift
      - path: Models.swift
      - path: SecondaryViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinn.shinncheat
        PRODUCT_NAME: ShinnCheat
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Shinn Cheat"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  ShinnCheat:
    build:
      targets:
        ShinnCheat: all
    archive:
      config: Release
