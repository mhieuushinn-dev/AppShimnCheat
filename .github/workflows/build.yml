name: Build Shinn Cheat

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Shinn Cheat IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Prepare source
        run: |
          set -e

          mkdir -p ShinnCheat

          test -f ContentView.swift && cp ContentView.swift ShinnCheat/
          test -f HomeView.swift && cp HomeView.swift ShinnCheat/
          test -f Glass.swift && cp Glass.swift ShinnCheat/
          test -f Models.swift && cp Models.swift ShinnCheat/
          test -f SecondaryViews.swift && cp SecondaryViews.swift/

          if [ -f ShinnCheatApp.swift ]; then
            cp ShinnCheatApp.swift ShinnCheat/
          fi

          if [ ! -f ShinnCheat/ShinnCheatApp.swift ]; then
            cat > ShinnCheat/ShinnCheatApp.swift <<'EOF'
import SwiftUI

@main
struct ShinnCheatApp: App {
    var body: some Scene {
        WindowGroup {
            ContentView()
        }
    }
}
EOF
          fi

          echo "=== SOURCE FILES ==="
          find ShinnCheat -type f | sort

      - name: Create project.yml
        run: |
          cat > project.yml <<'EOF'
name: ShinnCheat

options:
  bundleIdPrefix: com.shinn
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ShinnCheat:
    type: application
    platform: iOS

    sources:
      - path: ShinnCheat

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shinn.shinncheat
      PRODUCT_NAME: Shinn Cheat
      INFOPLIST_KEY_CFBundleDisplayName: Shinn Cheat
      INFOPLIST_KEY_LSRequiresIPhoneOS: true
      GENERATE_INFOPLIST_FILE: true
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
EOF

      - name: Generate Xcode project
        run: |
          xcodegen generate

          test -d ShinnCheat.xcodeproj

      - name: Build iOS app
        run: |
          set -e

          xcodebuild \
            -project ShinnCheat.xcodeproj \
            -scheme ShinnCheat \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Find app
        run: |
          set -e

          find build \
            -type d \
            -name "ShinnCheat.app" \
            -print

      - name: Create IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/ShinnCheat.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy ShinnCheat.app"
            find build -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          rm -f ShinnCheat.ipa

          mkdir Payload

          cp -R "$APP_PATH" Payload/ShinnCheat.app

          cd Payload
          zip -r ../ShinnCheat.ipa ShinnCheat.app
          cd ..

          rm -rf Payload

          echo "================================"
          echo "✅ IPA CREATED"
          echo "================================"

          ls -lh ShinnCheat.ipa

      - name: Verify IPA
        run: |
          set -e

          if [ ! -f ShinnCheat.ipa ]; then
            echo "❌ IPA không tồn tại"
            exit 1
          fi

          echo "✅ IPA OK"
          ls -lh ShinnCheat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 30