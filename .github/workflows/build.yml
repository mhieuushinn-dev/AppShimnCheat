      - name: Build Shinn Cheat
        run: |
          set -e

          echo "======================================"
          echo "BUILD SHINN CHEAT"
          echo "======================================"

          rm -rf build

          mkdir -p "$PWD/build/Release-iphoneos"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -target "ShinnCheat" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            PRODUCT_BUNDLE_IDENTIFIER="com.shinn.shinncheat" \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_FILE="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          echo ""
          echo "======================================"
          echo "BUILD RESULT"
          echo "======================================"

          find "$PWD/build" \
            -type d \
            -name "*.app" \
            -print