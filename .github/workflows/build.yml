name: Build Shinn Cheat IPA

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shinn Cheat
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. XCODE
      # =========================================================
      - name: Check Xcode
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcode-select -p
          xcodebuild -version

          echo ""
          echo "SDK:"
          xcodebuild -showsdks

      # =========================================================
      # 3. INSTALL XCODEGEN
      # =========================================================
      - name: Install XcodeGen
        run: |
          set -euxo pipefail

          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen đã có sẵn"
          else
            brew install xcodegen
          fi

          xcodegen version

      # =========================================================
      # 4. SHOW REPOSITORY
      # =========================================================
      - name: Inspect repository
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "REPOSITORY FILES"
          echo "========================================"

          pwd

          echo ""
          echo "Root:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Swift files:"
          find . -name "*.swift" -type f | sort

      # =========================================================
      # 5. PREPARE SOURCE DIRECTORY
      # =========================================================
      - name: Prepare ShinnCheat source
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "PREPARE SOURCE"
          echo "========================================"

          mkdir -p ShinnCheat

          # -----------------------------------------------------
          # Copy Swift files từ root vào ShinnCheat/
          # -----------------------------------------------------

          for file in \
            ContentView.swift \
            HomeView.swift \
            Glass.swift \
            Models.swift \
            SecondaryViews.swift \
            ShinnCheatApp.swift
          do
            if [ -f "$file" ]; then
              cp "$file" "ShinnCheat/$file"
              echo "Copied: $file"
            fi
          done

          # -----------------------------------------------------
          # Nếu Swift files nằm trong folder khác
          # -----------------------------------------------------

          if [ -d "AppShimnCheat" ]; then
            find AppShimnCheat \
              -maxdepth 2 \
              -name "*.swift" \
              -type f \
              -exec cp {} ShinnCheat/ \;
          fi

          # -----------------------------------------------------
          # Đảm bảo App entry tồn tại
          # -----------------------------------------------------

          if [ ! -f "ShinnCheat/ShinnCheatApp.swift" ]; then

            echo "ShinnCheatApp.swift chưa tồn tại -> tạo mới"

            cat > ShinnCheat/ShinnCheatApp.swift <<'SWIFT'
import SwiftUI

@main
struct ShinnCheatApp: App {

    var body: some Scene {
        WindowGroup {
            ContentView()
        }
    }
}
SWIFT

          fi

          # -----------------------------------------------------
          # Kiểm tra ContentView
          # -----------------------------------------------------

          if [ ! -f "ShinnCheat/ContentView.swift" ]; then

            echo "ContentView.swift chưa tồn tại -> tạo mới"

            cat > ShinnCheat/ContentView.swift <<'SWIFT'
import SwiftUI

struct ContentView: View {

    var body: some View {
        NavigationStack {
            HomeView()
        }
        .preferredColorScheme(.dark)
    }
}

#Preview {
    ContentView()
}
SWIFT

          fi

          # -----------------------------------------------------
          # Nếu HomeView chưa tồn tại
          # -----------------------------------------------------

          if [ ! -f "ShinnCheat/HomeView.swift" ]; then

            echo "HomeView.swift chưa tồn tại -> tạo mới"

            cat > ShinnCheat/HomeView.swift <<'SWIFT'
import SwiftUI

struct HomeView: View {

    var body: some View {
        ScrollView {
            VStack(spacing: 20) {

                VStack(spacing: 6) {
                    Text("♛")
                        .font(.system(size: 44))

                    Text("SHINN CHEAT")
                        .font(.system(size: 28, weight: .bold))

                    Text("Play Smart • Stay Ahead")
                        .font(.subheadline)
                        .foregroundStyle(.secondary)
                }
                .padding(.top, 30)

                GlassCard {
                    VStack(alignment: .leading, spacing: 10) {
                        Text("Shinn Cheat")
                            .font(.title2.bold())

                        Text("Kho package miễn phí")
                            .foregroundStyle(.secondary)

                        NavigationLink {
                            PackagesView()
                        } label: {
                            HStack {
                                Text("Xem Packages")
                                Spacer()
                                Image(systemName: "chevron.right")
                            }
                        }
                    }
                }

                HStack(spacing: 14) {

                    NavigationLink {
                        SettingsView()
                    } label: {
                        GlassTile(
                            icon: "gearshape.fill",
                            title: "Cài Đặt"
                        )
                    }

                    NavigationLink {
                        AboutView()
                    } label: {
                        GlassTile(
                            icon: "info.circle.fill",
                            title: "Giới Thiệu"
                        )
                    }
                }

                Spacer(minLength: 30)
            }
            .padding()
        }
        .background(Color.black.ignoresSafeArea())
        .navigationBarTitleDisplayMode(.inline)
    }
}

struct GlassCard<Content: View>: View {

    @ViewBuilder var content: Content

    var body: some View {
        content
            .padding()
            .frame(maxWidth: .infinity, alignment: .leading)
            .background(.ultraThinMaterial)
            .clipShape(RoundedRectangle(cornerRadius: 24))
            .overlay {
                RoundedRectangle(cornerRadius: 24)
                    .stroke(.white.opacity(0.12), lineWidth: 1)
            }
    }
}

struct GlassTile: View {

    let icon: String
    let title: String

    var body: some View {
        VStack(spacing: 10) {
            Image(systemName: icon)
                .font(.title2)

            Text(title)
                .font(.headline)
        }
        .frame(maxWidth: .infinity)
        .padding(.vertical, 22)
        .background(.ultraThinMaterial)
        .clipShape(RoundedRectangle(cornerRadius: 22))
        .overlay {
            RoundedRectangle(cornerRadius: 22)
                .stroke(.white.opacity(0.12), lineWidth: 1)
        }
    }
}
SWIFT

          fi

          # -----------------------------------------------------
          # SecondaryViews nếu thiếu
          # -----------------------------------------------------

          if [ ! -f "ShinnCheat/SecondaryViews.swift" ]; then

            echo "SecondaryViews.swift chưa tồn tại -> tạo mới"

            cat > ShinnCheat/SecondaryViews.swift <<'SWIFT'
import SwiftUI

struct PackagesView: View {

    var body: some View {
        List {
            Section("Free Fire") {
                PackageRow(name: "Body")
                PackageRow(name: "Chest")
                PackageRow(name: "Drag")
                PackageRow(name: "Magic")
            }

            Section("Free Fire Max") {
                PackageRow(name: "Body FFM")
                PackageRow(name: "Rob FFM")
                PackageRow(name: "ESP-AIM FFM")
            }

            Section("MOD VIP") {
                PackageRow(name: "Mod VIP")
            }
        }
        .navigationTitle("Packages")
    }
}

struct PackageRow: View {

    let name: String

    var body: some View {
        HStack {
            Image(systemName: "shippingbox.fill")

            VStack(alignment: .leading) {
                Text(name)
                    .font(.headline)

                Text("Shinn Cheat")
                    .font(.caption)
                    .foregroundStyle(.secondary)
            }

            Spacer()

            Image(systemName: "chevron.right")
                .foregroundStyle(.secondary)
        }
        .padding(.vertical, 4)
    }
}

struct SettingsView: View {

    var body: some View {
        Form {
            Section("Ứng dụng") {
                HStack {
                    Text("Tên")
                    Spacer()
                    Text("Shinn Cheat")
                        .foregroundStyle(.secondary)
                }

                HStack {
                    Text("Version")
                    Spacer()
                    Text("1.0.0")
                        .foregroundStyle(.secondary)
                }
            }

            Section("Repository") {
                HStack {
                    Text("JSON Repository")
                    Spacer()
                    Text("Online")
                        .foregroundStyle(.secondary)
                }
            }
        }
        .navigationTitle("Cài Đặt")
    }
}

struct AboutView: View {

    var body: some View {
        ScrollView {
            VStack(spacing: 18) {

                Text("♛")
                    .font(.system(size: 70))

                Text("SHINN CHEAT")
                    .font(.largeTitle.bold())

                Text("Play Smart • Stay Ahead")
                    .foregroundStyle(.secondary)

                Text("""
                Shinn Cheat là ứng dụng quản lý package.

                Ứng dụng sử dụng repository JSON để cập nhật thông tin package mà không cần phát hành lại ứng dụng.

                Telegram:
                @ShinnThieuu
                """)
                .multilineTextAlignment(.center)
                .padding()
            }
            .padding()
        }
        .navigationTitle("Giới Thiệu")
    }
}
SWIFT

          fi

          # -----------------------------------------------------
          # In danh sách cuối
          # -----------------------------------------------------

          echo ""
          echo "========================================"
          echo "FINAL SOURCE FILES"
          echo "========================================"

          find ShinnCheat \
            -maxdepth 1 \
            -type f \
            -name "*.swift" \
            -print \
            | sort

      # =========================================================
      # 6. CREATE PROJECT.YML
      # =========================================================
      - name: Create project.yml
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "CREATE PROJECT.YML"
          echo "========================================"

          cat > project.yml <<'YAML'
name: ShinnCheat

options:
  bundleIdPrefix: com.shinn
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  defaultConfig: Release

targets:

  ShinnCheat:
    type: application
    platform: iOS

    sources:
      - path: ShinnCheat

    info:
      path: ShinnCheat/Info.plist
      properties:
        CFBundleDisplayName: Shinn Cheat
        CFBundleName: Shinn Cheat
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinn.shinncheat
        PRODUCT_NAME: ShinnCheat
        SWIFT_VERSION: "5.0"

        TARGETED_DEVICE_FAMILY: "1,2"

        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

        DEVELOPMENT_TEAM: ""

        ENABLE_BITCODE: NO

        SWIFT_EMIT_LOC_STRINGS: NO

        GENERATE_INFOPLIST_FILE: NO
YAML

          echo ""
          echo "project.yml:"
          cat project.yml

      # =========================================================
      # 7. GENERATE XCODE PROJECT
      # =========================================================
      - name: Generate Xcode project
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "XCODEGEN"
          echo "========================================"

          rm -rf ShinnCheat.xcodeproj

          xcodegen generate \
            --spec project.yml

          echo ""
          echo "Generated:"
          ls -la ShinnCheat.xcodeproj

          echo ""
          echo "Info.plist:"
          ls -la ShinnCheat/Info.plist

      # =========================================================
      # 8. VALIDATE PROJECT
      # =========================================================
      - name: Validate Xcode project
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "VALIDATE"
          echo "========================================"

          test -d "ShinnCheat.xcodeproj"
          test -f "ShinnCheat/Info.plist"
          test -f "ShinnCheat/ShinnCheatApp.swift"
          test -f "ShinnCheat/ContentView.swift"
          test -f "ShinnCheat/HomeView.swift"
          test -f "ShinnCheat/SecondaryViews.swift"

          echo "✅ Project OK"
          echo "✅ Info.plist OK"
          echo "✅ App entry OK"
          echo "✅ ContentView OK"
          echo "✅ HomeView OK"
          echo "✅ SecondaryViews OK"

      # =========================================================
      # 9. BUILD
      # =========================================================
      - name: Build Shinn Cheat
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILD SHINN CHEAT"
          echo "========================================"

          rm -rf build

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -scheme "ShinnCheat" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # =========================================================
      # 10. FIND APP
      # =========================================================
      - name: Find built app
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FIND APP"
          echo "========================================"

          find build \
            -type d \
            -name "ShinnCheat.app" \
            -print

      # =========================================================
      # 11. CREATE IPA
      # =========================================================
      - name: Create IPA
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "CREATE IPA"
          echo "========================================"

          APP_PATH="$(find "$PWD/build" \
            -type d \
            -path "*/Release-iphoneos/ShinnCheat.app" \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy ShinnCheat.app"
            exit 1
          fi

          echo "APP:"
          echo "$APP_PATH"

          rm -rf Payload
          rm -f ShinnCheat.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/ShinnCheat.app

          # -----------------------------------------------------
          # Kiểm tra Info.plist trong app
          # -----------------------------------------------------

          if [ ! -f "Payload/ShinnCheat.app/Info.plist" ]; then
            echo "❌ APP KHÔNG CÓ Info.plist"
            exit 1
          fi

          echo "✅ Info.plist tồn tại trong app"

          cd Payload

          zip -r "../ShinnCheat.ipa" \
            ShinnCheat.app

          cd ..

          rm -rf Payload

          echo ""
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh ShinnCheat.ipa

      # =========================================================
      # 12. VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "VERIFY IPA"
          echo "========================================"

          test -f ShinnCheat.ipa

          unzip -l ShinnCheat.ipa | head -50

          echo ""
          echo "✅ ShinnCheat.ipa OK"

      # =========================================================
      # 13. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-iOS-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 14. UPLOAD DEBUG FILES
      # =========================================================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Debug
          path: |
            build/
            ShinnCheat.xcodeproj/
            project.yml
            ShinnCheat/
          if-no-files-found: warn
          retention-days: 7