name: Build Shinn Cheat

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shinn Cheat IPA
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT SOURCE
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. CHECK XCODE
      # =========================================================

      - name: Check Xcode
        run: |
          set -e

          echo "======================================"
          echo "XCODE INFORMATION"
          echo "======================================"

          xcode-select -p
          xcodebuild -version

          echo ""
          echo "======================================"
          echo "AVAILABLE iOS SDK"
          echo "======================================"

          xcodebuild -showsdks

      # =========================================================
      # 3. SHOW REPOSITORY STRUCTURE
      # =========================================================

      - name: Check Repository Structure
        run: |
          set -e

          echo "======================================"
          echo "CURRENT DIRECTORY"
          echo "======================================"

          pwd

          echo ""
          echo "======================================"
          echo "FILES"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "======================================"
          echo "XCODE PROJECTS"
          echo "======================================"

          find . \
            -type d \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print || true

      # =========================================================
      # 4. PREPARE XCODE PROJECT
      # =========================================================

      - name: Prepare Xcode Project
        run: |
          set -e

          echo "======================================"
          echo "PREPARING XCODE PROJECT"
          echo "======================================"

          # Nếu đã có project thật thì dùng luôn
          if [ -d "ShinnCheat.xcodeproj" ]; then

            echo "✅ Đã tìm thấy ShinnCheat.xcodeproj"

          # Nếu repo chỉ có project.pbxproj thì tạo
          # thư mục .xcodeproj từ file này
          elif [ -f "project.pbxproj" ]; then

            echo "⚠️ Không có ShinnCheat.xcodeproj"
            echo "✅ Tìm thấy project.pbxproj"
            echo "➡️ Đang tạo ShinnCheat.xcodeproj..."

            mkdir -p "ShinnCheat.xcodeproj"

            cp \
              "project.pbxproj" \
              "ShinnCheat.xcodeproj/project.pbxproj"

            echo "✅ Đã tạo ShinnCheat.xcodeproj"

          else

            echo "❌ Không tìm thấy:"
            echo "   ShinnCheat.xcodeproj"
            echo "   project.pbxproj"

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "PROJECT CONTENT"
          echo "======================================"

          find "ShinnCheat.xcodeproj" -maxdepth 2 -type f -print

      # =========================================================
      # 5. CHECK PROJECT
      # =========================================================

      - name: Inspect Xcode Project
        run: |
          set -e

          echo "======================================"
          echo "XCODE PROJECT"
          echo "======================================"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -list

      # =========================================================
      # 6. BUILD
      # =========================================================

      - name: Build Shinn Cheat
        run: |
          set -e

          echo "======================================"
          echo "BUILD SHINN CHEAT"
          echo "======================================"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -target "ShinnCheat" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # =========================================================
      # 7. FIND APP
      # =========================================================

      - name: Find Built App
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APP"
          echo "======================================"

          find build \
            -type d \
            -name "*.app" \
            -print

      # =========================================================
      # 8. VERIFY APP
      # =========================================================

      - name: Verify App
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/ShinnCheat.app"

          if [ ! -d "$APP_PATH" ]; then

            echo "❌ Không tìm thấy:"
            echo "$APP_PATH"

            echo ""
            echo "Các file .app hiện có:"

            find build \
              -type d \
              -name "*.app" \
              -print || true

            exit 1

          fi

          echo "======================================"
          echo "APP FOUND"
          echo "======================================"

          echo "$APP_PATH"

          echo ""
          echo "APP CONTENT:"

          ls -la "$APP_PATH"

      # =========================================================
      # 9. CREATE IPA
      # =========================================================

      - name: Create IPA
        run: |
          set -e

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          APP_PATH="build/Build/Products/Release-iphoneos/ShinnCheat.app"

          rm -rf Payload
          rm -f ShinnCheat.ipa

          mkdir -p Payload

          cp -R \
            "$APP_PATH" \
            "Payload/ShinnCheat.app"

          cd Payload

          zip -r \
            "../ShinnCheat.ipa" \
            "ShinnCheat.app"

          cd ..

          rm -rf Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh ShinnCheat.ipa

      # =========================================================
      # 10. VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          if [ ! -f "ShinnCheat.ipa" ]; then
            echo "❌ ShinnCheat.ipa không tồn tại"
            exit 1
          fi

          echo "✅ ShinnCheat.ipa đã được tạo"

          file ShinnCheat.ipa

          ls -lh ShinnCheat.ipa

      # =========================================================
      # 11. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-iOS-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 12. UPLOAD BUILD LOGS IF FAILED
      # =========================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Logs
          path: |
            build/
            *.xcresult
          if-no-files-found: ignore
          retention-days: 7