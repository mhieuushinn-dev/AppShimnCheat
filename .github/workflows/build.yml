name: Build Shinn Cheat

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shinn Cheat IPA
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. CHECK XCODE
      # =========================================================

      - name: Check Xcode
        run: |
          set -e

          echo "======================================"
          echo "XCODE INFORMATION"
          echo "======================================"

          xcode-select -p
          xcodebuild -version

          echo ""
          echo "======================================"
          echo "AVAILABLE SDK"
          echo "======================================"

          xcodebuild -showsdks


      # =========================================================
      # 3. CHECK REPOSITORY
      # =========================================================

      - name: Check Repository Structure
        run: |
          set -e

          echo "======================================"
          echo "CURRENT DIRECTORY"
          echo "======================================"

          pwd

          echo ""
          echo "======================================"
          echo "REPOSITORY FILES"
          echo "======================================"

          find . -maxdepth 4 -type f | sort

          echo ""
          echo "======================================"
          echo "XCODE PROJECTS"
          echo "======================================"

          find . \
            -type d \
            \( \
              -name "*.xcodeproj" \
              -o -name "*.xcworkspace" \
            \) \
            -print || true


      # =========================================================
      # 4. PREPARE XCODE PROJECT
      # =========================================================

      - name: Prepare Xcode Project
        run: |
          set -e

          echo "======================================"
          echo "PREPARING XCODE PROJECT"
          echo "======================================"

          # -----------------------------------------------------
          # Nếu đã có ShinnCheat.xcodeproj
          # -----------------------------------------------------

          if [ -d "ShinnCheat.xcodeproj" ]; then

            echo "✅ Found ShinnCheat.xcodeproj"

          # -----------------------------------------------------
          # Nếu chỉ có project.pbxproj
          # -----------------------------------------------------

          elif [ -f "project.pbxproj" ]; then

            echo "⚠️ ShinnCheat.xcodeproj chưa tồn tại"
            echo "✅ Found project.pbxproj"

            mkdir -p "ShinnCheat.xcodeproj"

            cp \
              "project.pbxproj" \
              "ShinnCheat.xcodeproj/project.pbxproj"

            echo "✅ Created ShinnCheat.xcodeproj"

          # -----------------------------------------------------
          # Không tìm thấy project
          # -----------------------------------------------------

          else

            echo "❌ Không tìm thấy Xcode project."

            echo ""
            echo "Cần một trong:"
            echo "  ShinnCheat.xcodeproj/"
            echo "  project.pbxproj"

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "PROJECT FILE"
          echo "======================================"

          find "ShinnCheat.xcodeproj" \
            -maxdepth 2 \
            -type f \
            -print


      # =========================================================
      # 5. INSPECT XCODE PROJECT
      # =========================================================

      - name: Inspect Xcode Project
        run: |
          set -e

          echo "======================================"
          echo "XCODE PROJECT INFORMATION"
          echo "======================================"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -list


      # =========================================================
      # 6. CHECK TARGET
      # =========================================================

      - name: Check ShinnCheat Target
        run: |
          set -e

          echo "======================================"
          echo "CHECK SHINN CHEAT TARGET"
          echo "======================================"

          PROJECT_INFO="$(
            xcodebuild \
              -project "ShinnCheat.xcodeproj" \
              -list
          )"

          echo "$PROJECT_INFO"

          echo ""
          echo "======================================"
          echo "SEARCH TARGET"
          echo "======================================"

          if echo "$PROJECT_INFO" | grep -q "ShinnCheat"; then
            echo "✅ Target/Scheme ShinnCheat được tìm thấy."
          else
            echo "❌ Không tìm thấy ShinnCheat trong project."
            exit 1
          fi


      # =========================================================
      # 7. BUILD
      # =========================================================

      - name: Build Shinn Cheat
        run: |
          set -e

          echo "======================================"
          echo "BUILD SHINN CHEAT"
          echo "======================================"

          rm -rf build

          mkdir -p \
            "build/Release-iphoneos"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -target "ShinnCheat" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          echo ""
          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

          find build \
            -type d \
            -name "*.app" \
            -print


      # =========================================================
      # 8. VERIFY APP
      # =========================================================

      - name: Verify App
        run: |
          set -e

          echo "======================================"
          echo "VERIFY APP"
          echo "======================================"

          APP_PATH="build/Release-iphoneos/ShinnCheat.app"

          if [ ! -d "$APP_PATH" ]; then

            echo "❌ Không tìm thấy:"
            echo "$APP_PATH"

            echo ""
            echo "Các .app đã build:"

            find build \
              -type d \
              -name "*.app" \
              -print || true

            exit 1

          fi

          echo "✅ ShinnCheat.app FOUND"

          echo ""
          echo "APP CONTENT:"

          ls -la "$APP_PATH"


      # =========================================================
      # 9. CHECK APP BINARY
      # =========================================================

      - name: Check App Binary
        run: |
          set -e

          APP_PATH="build/Release-iphoneos/ShinnCheat.app"

          echo "======================================"
          echo "CHECK APP BINARY"
          echo "======================================"

          if [ ! -f "$APP_PATH/ShinnCheat" ]; then
            echo "❌ Không tìm thấy executable ShinnCheat"
            exit 1
          fi

          echo "✅ Executable found"

          file "$APP_PATH/ShinnCheat"


      # =========================================================
      # 10. CREATE PAYLOAD
      # =========================================================

      - name: Prepare IPA
        run: |
          set -e

          echo "======================================"
          echo "PREPARE IPA"
          echo "======================================"

          rm -rf Payload
          rm -f ShinnCheat.ipa

          mkdir -p Payload

          cp -R \
            "build/Release-iphoneos/ShinnCheat.app" \
            "Payload/ShinnCheat.app"

          echo "✅ Payload/ShinnCheat.app created"


      # =========================================================
      # 11. CREATE IPA
      # =========================================================

      - name: Create IPA
        run: |
          set -e

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          cd Payload

          zip -r \
            "../ShinnCheat.ipa" \
            "ShinnCheat.app"

          cd ..

          rm -rf Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh ShinnCheat.ipa


      # =========================================================
      # 12. VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          echo "======================================"
          echo "VERIFY IPA"
          echo "======================================"

          if [ ! -f "ShinnCheat.ipa" ]; then
            echo "❌ ShinnCheat.ipa không tồn tại."
            exit 1
          fi

          echo "✅ ShinnCheat.ipa tồn tại."

          file ShinnCheat.ipa

          ls -lh ShinnCheat.ipa


      # =========================================================
      # 13. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-iOS-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 14. UPLOAD BUILD LOGS IF FAILED
      # =========================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Logs
          path: |
            build/
            *.xcresult
          if-no-files-found: ignore
          retention-days: 7