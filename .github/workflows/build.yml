name: Build Shinn Cheat

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shinn Cheat IPA
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. CHECK XCODE
      # =========================================================

      - name: Check Xcode
        run: |
          set -e

          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcode-select -p
          xcodebuild -version

          echo ""
          xcodebuild -showsdks


      # =========================================================
      # 3. SHOW REPOSITORY
      # =========================================================

      - name: Check Repository Structure
        run: |
          set -e

          echo "======================================"
          echo "REPOSITORY"
          echo "======================================"

          pwd

          echo ""
          echo "FILES:"
          find . -maxdepth 4 -type f | sort


      # =========================================================
      # 4. PREPARE SOURCE FILES
      # =========================================================

      - name: Prepare Source Files
        run: |
          set -e

          echo "======================================"
          echo "PREPARE SHINN CHEAT SOURCE"
          echo "======================================"

          mkdir -p "ShinnCheat"

          FILES="
          ContentView.swift
          Glass.swift
          HomeView.swift
          Models.swift
          ShinnCheatApp.swift
          SecondaryViews.swift
          "

          for FILE in $FILES
          do
            if [ -f "$FILE" ]; then

              cp "$FILE" "ShinnCheat/$FILE"

              echo "✅ Copied:"
              echo "   $FILE"
              echo "   → ShinnCheat/$FILE"

            elif [ -f "ShinnCheat/$FILE" ]; then

              echo "✅ Already exists:"
              echo "   ShinnCheat/$FILE"

            else

              echo "❌ Missing source file:"
              echo "   $FILE"

              exit 1

            fi
          done

          echo ""
          echo "======================================"
          echo "SHINN CHEAT SOURCES"
          echo "======================================"

          find "ShinnCheat" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # =========================================================
      # 5. PREPARE XCODE PROJECT
      # =========================================================

      - name: Prepare Xcode Project
        run: |
          set -e

          echo "======================================"
          echo "PREPARE XCODE PROJECT"
          echo "======================================"

          if [ -d "ShinnCheat.xcodeproj" ]; then

            echo "✅ Found ShinnCheat.xcodeproj"

          elif [ -f "project.pbxproj" ]; then

            echo "⚠️ ShinnCheat.xcodeproj not found."
            echo "✅ Found project.pbxproj"

            mkdir -p "ShinnCheat.xcodeproj"

            cp \
              "project.pbxproj" \
              "ShinnCheat.xcodeproj/project.pbxproj"

            echo "✅ Created:"
            echo "   ShinnCheat.xcodeproj"

          else

            echo "❌ Không tìm thấy project.pbxproj"

            exit 1

          fi

          echo ""
          echo "PROJECT:"
          find "ShinnCheat.xcodeproj" \
            -maxdepth 2 \
            -type f \
            -print


      # =========================================================
      # 6. INSPECT PROJECT
      # =========================================================

      - name: Inspect Xcode Project
        run: |
          set -e

          echo "======================================"
          echo "XCODE PROJECT INFORMATION"
          echo "======================================"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -list


      # =========================================================
      # 7. CHECK TARGET
      # =========================================================

      - name: Check ShinnCheat Target
        run: |
          set -e

          echo "======================================"
          echo "CHECK TARGET"
          echo "======================================"

          PROJECT_INFO="$(
            xcodebuild \
              -project "ShinnCheat.xcodeproj" \
              -list
          )"

          echo "$PROJECT_INFO"

          echo ""
          echo "======================================"
          echo "SEARCHING FOR SHINNCHEAT"
          echo "======================================"

          if echo "$PROJECT_INFO" | grep -q "ShinnCheat"; then

            echo "✅ ShinnCheat target/project found"

          else

            echo "❌ Không tìm thấy target ShinnCheat"

            exit 1

          fi


      # =========================================================
      # 8. BUILD
      # =========================================================

      - name: Build Shinn Cheat
        run: |
          set -e

          echo "======================================"
          echo "BUILD SHINN CHEAT"
          echo "======================================"

          rm -rf build

          mkdir -p "build/Release-iphoneos"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -target "ShinnCheat" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          echo ""
          echo "======================================"
          echo "BUILD COMPLETE"
          echo "======================================"

          find build \
            -type d \
            -name "*.app" \
            -print


      # =========================================================
      # 9. VERIFY APP
      # =========================================================

      - name: Verify App
        run: |
          set -e

          echo "======================================"
          echo "VERIFY APP"
          echo "======================================"

          APP_PATH="build/Release-iphoneos/ShinnCheat.app"

          if [ ! -d "$APP_PATH" ]; then

            echo "❌ Không tìm thấy:"
            echo "$APP_PATH"

            echo ""
            echo "Các APP hiện có:"

            find build \
              -type d \
              -name "*.app" \
              -print || true

            exit 1

          fi

          echo "✅ ShinnCheat.app FOUND"

          echo ""
          echo "APP CONTENT:"

          ls -la "$APP_PATH"


      # =========================================================
      # 10. VERIFY EXECUTABLE
      # =========================================================

      - name: Verify App Executable
        run: |
          set -e

          APP_PATH="build/Release-iphoneos/ShinnCheat.app"

          echo "======================================"
          echo "VERIFY EXECUTABLE"
          echo "======================================"

          if [ ! -f "$APP_PATH/ShinnCheat" ]; then

            echo "❌ Không tìm thấy executable:"
            echo "$APP_PATH/ShinnCheat"

            exit 1

          fi

          echo "✅ Executable found"

          file "$APP_PATH/ShinnCheat"


      # =========================================================
      # 11. CREATE PAYLOAD
      # =========================================================

      - name: Prepare IPA
        run: |
          set -e

          echo "======================================"
          echo "PREPARE IPA"
          echo "======================================"

          rm -rf Payload
          rm -f ShinnCheat.ipa

          mkdir -p Payload

          cp -R \
            "build/Release-iphoneos/ShinnCheat.app" \
            "Payload/ShinnCheat.app"

          echo "✅ Payload created"


      # =========================================================
      # 12. CREATE IPA
      # =========================================================

      - name: Create IPA
        run: |
          set -e

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          cd Payload

          zip -r \
            "../ShinnCheat.ipa" \
            "ShinnCheat.app"

          cd ..

          rm -rf Payload

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh "ShinnCheat.ipa"


      # =========================================================
      # 13. VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          echo "======================================"
          echo "VERIFY IPA"
          echo "======================================"

          if [ ! -f "ShinnCheat.ipa" ]; then

            echo "❌ ShinnCheat.ipa không tồn tại"

            exit 1

          fi

          echo "✅ ShinnCheat.ipa tồn tại"

          file "ShinnCheat.ipa"

          ls -lh "ShinnCheat.ipa"


      # =========================================================
      # 14. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-iOS-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 15. UPLOAD LOGS IF FAILED
      # =========================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Logs
          path: |
            build/
            *.xcresult
          if-no-files-found: ignore
          retention-days: 7