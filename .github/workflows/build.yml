name: Build Shinn Cheat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Shinn Cheat IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate --spec project.yml
          test -d ShinnCheat.xcodeproj
          xcodebuild -list -project ShinnCheat.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ShinnCheat.xcodeproj \
            -scheme ShinnCheat \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee build.log | tail -n 100

      - name: Create IPA
        run: |
          set -e
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/ShinnCheat.app"
          test -d "$APP_PATH" || { echo "ERROR: .app not found"; find DerivedData -name "*.app" -maxdepth 6; exit 1; }
          rm -rf Payload ShinnCheat.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ShinnCheat.ipa Payload
          ls -lh ShinnCheat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-iOS-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
