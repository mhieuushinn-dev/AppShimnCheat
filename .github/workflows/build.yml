      - name: Prepare Shinn Cheat Source
        run: |
          set -e

          echo "======================================"
          echo "PREPARE SHINN CHEAT SOURCE"
          echo "======================================"

          mkdir -p ShinnCheat

          files=(
            "ShinnCheatApp.swift"
            "ContentView.swift"
            "HomeView.swift"
            "Glass.swift"
            "Models.swift"
            "SecondaryViews.swift"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing source file: $file"
              exit 1
            fi

            cp "$file" "ShinnCheat/$file"

            echo "✅ Copied:"
            echo "   $file"
            echo "   → ShinnCheat/$file"
          done

          echo ""
          echo "======================================"
          echo "SOURCE FILES READY"
          echo "======================================"

          find ShinnCheat -maxdepth 1 -type f -print