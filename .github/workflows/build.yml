      - name: Prepare Xcode Project
        run: |
          set -e

          echo "=== Current directory ==="
          pwd

          echo "=== Files ==="
          find . -maxdepth 2 -type f | sort

          if [ ! -f "project.pbxproj" ]; then
            echo "❌ Không tìm thấy project.pbxproj"
            exit 1
          fi

          mkdir -p "ShinnCheat.xcodeproj"
          cp "project.pbxproj" "ShinnCheat.xcodeproj/project.pbxproj"

          echo "✅ Đã tạo ShinnCheat.xcodeproj"

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -list

      - name: Build Shinn Cheat
        run: |
          set -e

          xcodebuild \
            -project "ShinnCheat.xcodeproj" \
            -target "ShinnCheat" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build